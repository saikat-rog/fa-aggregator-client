<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36" />
      <stop offset="100%" stop-color="#6C4BFF" />
    </linearGradient>
    <filter id="fmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#201A2B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#fmGradient)" />

  <!-- Radio Beacon Mark (White) -->
  <g transform="translate(14, 14)" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center antenna/mast & emitter dot -->
    <circle cx="18" cy="18" r="3" fill="#FFFFFF" stroke="none" />
    <path d="M18 21v11" stroke-width="2.5" />
    <path d="M14 32h8" stroke-width="2.5" />

    <!-- Left Waves -->
    <path d="M11 11a10 10 0 0 0 0 14" />
    <path d="M6 6a17 17 0 0 0 0 24" />

    <!-- Right Waves -->
    <path d="M25 11a10 10 0 0 1 0 14" />
    <path d="M30 6a17 17 0 0 1 0 24" />
  </g>
</svg>